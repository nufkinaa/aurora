<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Aurora</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236c58ff'/><stop offset='.5' stop-color='%23b76cff'/><stop offset='1' stop-color='%234ea3ff'/></linearGradient></defs><rect width='100' height='100' rx='24' fill='url(%23g)'/></svg>" />
  <!-- External artwork is served through the server's own disk cache
       (/img/ext — see ui.js artUrl), so no third-party preconnect is needed
       any more: first-ever fetches happen server-side, everything after is
       same-origin at LAN speed. -->

  <!-- Theme boot: the profile's theme + accent are mirrored in localStorage
       and applied HERE, before the stylesheets, so a cold load never flashes
       the default look. The server-side profile record is the source of
       truth; state.js re-syncs both on profile entry. -->
  <script>
    (() => {
      try {
        const t = localStorage.getItem("aurora-theme");
        if (t === "oled" || t === "warm") document.documentElement.dataset.theme = t;
        const a = localStorage.getItem("aurora-accent");
        if (a && /^#[0-9a-f]{6}$/i.test(a)) {
          const s = document.documentElement.style;
          s.setProperty("--accent", a);
          s.setProperty("--accent-strong", a);
          s.setProperty("--progress", a);
          s.setProperty("--accent-rgb",
            [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)).join(", "));
        }
      } catch {}
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/screens.css" />
  <link rel="stylesheet" href="/css/responsive.css" />

  <!-- The eager module graph. Without this the browser has to fetch main.js,
       parse it, discover its imports, fetch those, parse them, discover the
       rest — a waterfall as deep as the import tree, and every level costs a
       full round trip. Declaring them here starts them all at once.
       GENERATED by walking main.js's static imports — regenerate whenever
       they change; anything lazy (hls.js, pair.js, easter.js) is deliberately
       absent. -->
  <link rel="modulepreload" href="/js/main.js" />
  <link rel="modulepreload" href="/js/api.js" />
  <link rel="modulepreload" href="/js/aurora-sky.js" />
  <link rel="modulepreload" href="/js/aurora.js" />
  <link rel="modulepreload" href="/js/claim.js" />
  <link rel="modulepreload" href="/js/components.js" />
  <link rel="modulepreload" href="/js/downloadPicker.js" />
  <link rel="modulepreload" href="/js/focus.js" />
  <link rel="modulepreload" href="/js/google.js" />
  <link rel="modulepreload" href="/js/narrator.js" />
  <link rel="modulepreload" href="/js/router.js" />
  <link rel="modulepreload" href="/js/rowArrows.js" />
  <link rel="modulepreload" href="/js/screensaver.js" />
  <link rel="modulepreload" href="/js/state.js" />
  <link rel="modulepreload" href="/js/suggest.js" />
  <link rel="modulepreload" href="/js/surprise.js" />
  <link rel="modulepreload" href="/js/ui.js" />
  <link rel="modulepreload" href="/js/ws.js" />
  <link rel="modulepreload" href="/js/screens/browse.js" />
  <link rel="modulepreload" href="/js/screens/home.js" />
  <link rel="modulepreload" href="/js/screens/login.js" />
  <link rel="modulepreload" href="/js/screens/pickforme.js" />
  <link rel="modulepreload" href="/js/screens/profiles.js" />
  <link rel="modulepreload" href="/js/screens/requests.js" />
  <link rel="modulepreload" href="/js/screens/search.js" />
  <link rel="modulepreload" href="/js/screens/shortcuts.js" />
  <link rel="modulepreload" href="/js/screens/taste.js" />
  <link rel="modulepreload" href="/js/screens/wrapped.js" />
</head>
<body>
  <nav class="nav" id="nav">
    <a class="nav-logo" href="#/" data-nav tabindex="-1" aria-hidden="true">
      <span class="logo-mark"></span>
      <span>Aurora</span>
    </a>
    <a class="nav-item focusable" href="#/search" data-route="#/search" data-nav>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="vertical-align:-3px"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </a>
    <a class="nav-item focusable" href="#/" data-route="#/" data-nav>Home</a>
    <a class="nav-item focusable" href="#/movies" data-route="#/movies" data-nav>Movies</a>

      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-4px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
    <button class="nav-profile focusable" id="nav-profile" title="Switch profile">
      <span class="avatar" id="nav-avatar">🍿</span>
      <span id="nav-profile-name">Profile</span>
    </button>
  </nav>

  <main id="app"></main>

  <div id="overlay-root"></div>
  <div id="toasts"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
