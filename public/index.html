<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Opened from a phone's Home Screen, Aurora takes the WHOLE screen: the
       page runs under the status bar and around the Dynamic Island instead of
       stopping at a black band beneath it. The chrome keeps clear of the
       island and the home indicator through env(safe-area-inset-*) (glass.css). -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Aurora" />
  <!-- iOS turns anything that looks like a phone number (a year range, an
       episode code) into a tappable link unless told not to. -->
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="#070811" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <title>Aurora</title>
  <meta name="description" content="Aurora — your household's own streaming platform: the films and shows on your server, on every screen." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3CradialGradient id='gv' gradientUnits='userSpaceOnUse' cx='30.7' cy='0' r='477.9'%3E%3Cstop offset='0' stop-color='%238b7bff' stop-opacity='0.620'/%3E%3Cstop offset='.3' stop-color='%236856e2' stop-opacity='0.409'/%3E%3Cstop offset='.62' stop-color='%236856e2' stop-opacity='0.136'/%3E%3Cstop offset='1' stop-color='%236856e2' stop-opacity='0.000'/%3E%3C/radialGradient%3E%3CradialGradient id='gn' gradientUnits='userSpaceOnUse' cx='512' cy='522.2' r='405.5'%3E%3Cstop offset='0' stop-color='%238cffbe' stop-opacity='0.336'/%3E%3Cstop offset='.22' stop-color='%2346c896' stop-opacity='0.311'/%3E%3Cstop offset='.58' stop-color='%2346c896' stop-opacity='0.101'/%3E%3Cstop offset='1' stop-color='%2346c896' stop-opacity='0.000'/%3E%3C/radialGradient%3E%3ClinearGradient id='a' gradientUnits='userSpaceOnUse' x1='140' y1='250' x2='400' y2='110'%3E%3Cstop offset='0' stop-color='%2346c896'/%3E%3Cstop offset='1' stop-color='%238cffbe'/%3E%3C/linearGradient%3E%3ClinearGradient id='b' gradientUnits='userSpaceOnUse' x1='136' y1='0' x2='440' y2='0'%3E%3Cstop offset='0' stop-color='%235fc4d8'/%3E%3Cstop offset='1' stop-color='%239be4f2'/%3E%3C/linearGradient%3E%3ClinearGradient id='c' gradientUnits='userSpaceOnUse' x1='140' y1='430' x2='390' y2='300'%3E%3Cstop offset='0' stop-color='%236856e2'/%3E%3Cstop offset='1' stop-color='%238b7bff'/%3E%3C/linearGradient%3E%3CclipPath id='k'%3E%3Cpath d='M136 122A34 34 0 0 1 187 92.6L425 227A34 34 0 0 1 425 285L187 419.4A34 34 0 0 1 136 390Z'/%3E%3C/clipPath%3E%3CclipPath id='r'%3E%3Crect width='512' height='512' rx='158'/%3E%3C/clipPath%3E%3C/defs%3E%3Cg clip-path='url(%23r)'%3E%3Crect width='512' height='512' fill='%230b0c14'/%3E%3Crect width='512' height='512' fill='url(%23gv)'/%3E%3Crect width='512' height='512' fill='url(%23gn)'/%3E%3Cg transform='translate(256 256) scale(0.9600) translate(-256 -256)'%3E%3Cg clip-path='url(%23k)'%3E%3Cpath fill='url(%23a)' d='M96 240C214 292 288 190 480 226V60H96Z'/%3E%3Cpath fill='url(%23b)' d='M96 260C214 312 288 204.7 480 238.3V283.7C288 259.3 214 386 96 334Z'/%3E%3Cpath fill='url(%23c)' d='M96 354C214 406 288 274 480 296V452H96Z'/%3E%3C/g%3E%3C/g%3E%3C/g%3E%3C/svg%3E" />
  <!-- External artwork is served through the server's own disk cache
       (/img/ext — see ui.js artUrl), so no third-party preconnect is needed
       any more: first-ever fetches happen server-side, everything after is
       same-origin at LAN speed. -->

  <!-- Theme boot: the profile's theme + accent are mirrored in localStorage
       and applied HERE, before the stylesheets, so a cold load never flashes
       the default look. The server-side profile record is the source of
       truth; state.js re-syncs both on profile entry. -->
  <script>
    (() => {
      try {
        const t = localStorage.getItem("aurora-theme");
        if (t === "oled" || t === "warm") document.documentElement.dataset.theme = t;
        // The look (classic, or the glass one) is applied before the sheets
        // load, so a glass profile never flashes the classic chrome.
        // Glass is the default; only a profile that chose the classic look
        // ("legacy") boots without it.
        if (localStorage.getItem("aurora-look") !== "legacy") document.documentElement.dataset.look = "glass";
        // An iPhone with the Dynamic Island (14 Pro and later): the top
        // controls sit a little lower (tokens.css --top-gap). From the Home
        // Screen the top inset says so by itself; in a Safari tab it is 0 on
        // every iPhone, so the screen tells: the island phones are 852, 874,
        // 912, 932 or 956 points tall, the notch ones 812, 844, 896 or 926,
        // the older ones less (a phone set to Display Zoom counts as smaller).
        if (/iPhone/.test(navigator.userAgent)) {
          const tall = Math.max(screen.width, screen.height);
          if (tall >= 852 && tall !== 896 && tall !== 926) document.documentElement.classList.add("ios-island");
        }
        const a =localStorage.getItem("aurora-accent");
        if (a && /^#[0-9a-f]{6}$/i.test(a)) {
          const s = document.documentElement.style;
          s.setProperty("--accent", a);
          s.setProperty("--accent-strong", a);
          s.setProperty("--progress", a);
          s.setProperty("--accent-rgb",
            [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16)).join(", "));
        }
      } catch {}
    })();
  </script>
  <!-- Boot's first questions, asked NOW. The app cannot draw its first
       screen before it knows who is signed in, which profiles exist, this
       profile's watch state and what Home holds — and it used to ask them
       one after another, each only once the answer before had arrived, and
       the first only once all its code had been fetched and run: four round
       trips in a row, on a line where a round trip is half a second. Asked
       from here they travel beside the code, in parallel, and js/api.js
       hands each waiting answer to the call that would have made the
       request (same address, same headers; an answer that is not a plain
       200, or is older than a few seconds, is dropped and asked again the
       usual way).
       Nothing is asked that boot would not ask, so nothing is refused that
       was not refused before. What this device learned last time decides:
         aurora-authmode   the sign-in mode (main.js). The profile list is
                           asked for only where the last visit could read it.
         aurora-early      how the remembered profile is entered (state.js):
                           "open" — no password; "token" — with this tab's
                           unlock token; absent (a kids profile, a locked
                           one, nobody yet, or a tab that has just learned
                           its sign-in is gone — session.js, main.js) — the
                           door decides, nothing early.
       Home is asked for only when Home is the page being opened.
       "Who am I" goes out with the remembered profile's unlock token, as
       boot asks it (that is how a profile that owes a new password is told
       apart). Every one of these says it is early (X-Early): the server
       must not read a question asked before the page knows who it is as a
       decision — for a profile that owes a new password, asking for the
       wall's list means "this device has left" and ends its sign-in
       (src/lib/resetgate.js); an early one is refused instead, like any
       other request made as that profile, and boot asks again in its turn. -->
  <script>
    (() => {
      try {
        const store = (window.__auroraEarly = {});
        const ask = (url, token) => {
          const headers = { "X-Blur": "1", "X-Early": "1" };
          if (token) headers["X-Profile-Token"] = token;
          const res = fetch(url, { headers });
          res.catch(() => {});
          store[url + "|" + (token || "")] = { at: performance.now(), res };
        };
        const mode = localStorage.getItem("aurora-authmode");
        const how = localStorage.getItem("aurora-early");
        const id = localStorage.getItem("aurora-profile");
        const named = !!id && /^[A-Za-z0-9_-]{1,40}$/.test(id);
        let mine = null;
        if (named) {
          try { mine = sessionStorage.getItem("aurora-token-" + id); } catch {}
        }
        ask("/api/me", mine);
        ask("/api/server-info");
        const known = named && (how === "open" || how === "token");
        if (mode === "open" || mode === "transition" || (mode === "closed" && known)) ask("/api/profiles");
        if (known && mode) {
          const token = how === "token" ? mine : null;
          if (how === "open" || token) {
            ask("/api/profiles/" + id + "/state", token);
            if (!location.hash || location.hash === "#/") ask("/api/home?profile=" + encodeURIComponent(id), token);
          }
        }
      } catch {}
    })();
  </script>
  <!-- A deploy can land between one module fetch and the next, so a page
       may hold half old, half new code — the symptom is an import that
       names a binding the cached module lacks. One reload, at most once a
       minute, fixes it; anything else is left alone. -->
  <script>
    window.addEventListener("error", (e) => {
      const m = String((e && e.message) || "");
      if (!/Importing binding name|does not provide an export named|Failed to fetch dynamically imported module/.test(m)) return;
      try {
        const k = "aurora-mixed-reload";
        const t = Number(sessionStorage.getItem(k) || 0);
        if (Date.now() - t < 60000) return;
        sessionStorage.setItem(k, String(Date.now()));
      } catch {}
      location.reload();
    });
  </script>
  <!-- The six sheets (tokens, base, components, screens, responsive, glass —
       in that order) as one minified file, built and hashed by the server
       (src/lib/cssbundle.js). One render-blocking request instead of six. -->
  <link rel="stylesheet" href="/css/aurora.css" />

  <!-- The eager module graph. Without this the browser has to fetch main.js,
       parse it, discover its imports, fetch those, parse them, discover the
       rest — a waterfall as deep as the import tree, and every level costs a
       full round trip. Declaring them here starts them all at once.
       THE SERVER WRITES THIS LIST when it serves the page (src/lib/assetver.js
       walks main.js's static imports, and adds the import map that gives
       every module its cacheable address) — ahead of the stylesheet above.
       Nothing is listed here: a list kept by hand had fallen four modules
       behind, and a page served without the rewrite simply loads as the
       import tree unfolds. -->
</head>
<body>
  <!-- the glass look's sky: a full-viewport aurora behind every page (js/aurora-sky.js) -->
  <canvas class="glass-sky" id="glass-sky" aria-hidden="true"></canvas>
  <nav class="nav" id="nav">
    <a class="nav-logo" href="#/" data-nav tabindex="-1" aria-hidden="true">
      <span class="logo-mark"></span>
      <span>Aurora</span>
    </a>
    <!-- .nav-items is display:contents in the classic look (no layout change) and
         the floating glass island in the glass one -->
    <div class="nav-items">
    <a class="nav-item focusable" href="#/search" data-route="#/search" data-ui="nav.search" data-nav aria-label="Search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="vertical-align:-3px"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </a>
    <a class="nav-item focusable" href="#/" data-route="#/" data-ui="nav.home" data-nav>Home</a>
    <a class="nav-item focusable" href="#/movies" data-route="#/movies" data-ui="nav.movies" data-nav>Movies</a>
    <a class="nav-item focusable" href="#/shows" data-route="#/shows" data-ui="nav.shows" data-nav>Shows</a>
    <a class="nav-item focusable" href="#/list" data-route="#/list" data-ui="nav.mylist" data-nav>My List</a>
    <a class="nav-item focusable hidden" id="nav-pick" href="#/pick" data-route="#/pick" data-ui="nav.ai" data-nav>AI</a>
    <a class="nav-item focusable" id="nav-new" href="#/new" data-route="#/new" data-ui="nav.new" data-nav>New<i class="nav-new-dot" aria-hidden="true"></i></a>
    <a class="nav-item focusable hidden" id="nav-saved" href="#/saved" data-route="#/saved" data-ui="nav.saved" data-nav title="On this device — saved titles, saves under way, a video from this device">Saved</a>
    </div>
    <!-- the empty nav stretch hosts a slow aurora borealis (decoration only;
         painted by js/aurora.js while the nav is solid) -->
    <span class="nav-spacer" aria-hidden="true">
      <canvas class="nav-aurora" id="nav-aurora"></canvas>
    </span>
    <!-- live download pill: hidden when idle, "⬇ 2 · 47%" while the server
         pulls something down; tapping it opens the requests/downloads page -->
    <a class="nav-dl focusable hidden" id="nav-dl" href="#/downloads" data-ui="nav.downloads" data-nav title="Downloads in progress"></a>
    <a class="nav-item nav-gear focusable" href="#/preferences" data-route="#/preferences" data-ui="nav.settings" data-nav title="Settings" aria-label="Settings">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-4px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
    <button class="nav-profile focusable" id="nav-profile" data-ui="nav.profile" title="Switch profile">
      <span class="avatar" id="nav-avatar">🍿</span>
      <span id="nav-profile-name">Profile</span>
    </button>
  </nav>

  <main id="app"></main>

  <div id="overlay-root"></div>
  <div id="toasts"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
