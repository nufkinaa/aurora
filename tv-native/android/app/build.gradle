import com.android.build.api.instrumentation.AsmClassVisitorFactory
import com.android.build.api.instrumentation.ClassContext
import com.android.build.api.instrumentation.ClassData
import com.android.build.api.instrumentation.FramesComputationMode
import com.android.build.api.instrumentation.InstrumentationParameters
import com.android.build.api.instrumentation.InstrumentationScope
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.MethodVisitor
import org.objectweb.asm.Opcodes

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * react-native-tvos PR #1159, applied to the PREBUILT react-android AAR.
 *
 * ReactViewManager.onAfterUpdateTransaction (react-native-tvos 0.86.0-2) asks
 * AccessibilityManager.getEnabledAccessibilityServiceList() — a synchronous binder call into
 * system_server — on every view update, including every frame of a native-driver animation.
 * The app links react-android from Maven, so the source patch in patches/ (kept so a
 * build-from-source picks it up) never reaches the APK. This rewrites that ONE call, in that
 * ONE class, to com.auroratv.A11yServices.enabledList, which answers from local state or a
 * cache (see A11yServices.kt). Same arguments on the stack, same return type; nothing else in
 * the class or in any other class is touched. Drop this block once the app moves to a
 * react-native-tvos release that carries #1159.
 */
abstract class A11yQueryRewrite implements AsmClassVisitorFactory<InstrumentationParameters.None> {
    static final String TARGET = 'com.facebook.react.views.view.ReactViewManager'

    @Override
    ClassVisitor createClassVisitor(ClassContext classContext, ClassVisitor next) {
        return new A11yClassVisitor(instrumentationContext.apiVersion.get(), next)
    }

    @Override
    boolean isInstrumentable(ClassData classData) {
        return classData.className == TARGET
    }
}

class A11yClassVisitor extends ClassVisitor {
    final int api

    A11yClassVisitor(int api, ClassVisitor next) {
        super(api, next)
        this.api = api
    }

    @Override
    MethodVisitor visitMethod(int access, String name, String desc, String sig, String[] exceptions) {
        return new A11yMethodVisitor(api, super.visitMethod(access, name, desc, sig, exceptions))
    }
}

class A11yMethodVisitor extends MethodVisitor {
    A11yMethodVisitor(int api, MethodVisitor next) {
        super(api, next)
    }

    @Override
    void visitMethodInsn(int opcode, String owner, String name, String desc, boolean itf) {
        if (opcode == Opcodes.INVOKEVIRTUAL &&
                owner == 'android/view/accessibility/AccessibilityManager' &&
                name == 'getEnabledAccessibilityServiceList' &&
                desc == '(I)Ljava/util/List;') {
            super.visitMethodInsn(Opcodes.INVOKESTATIC, 'com/auroratv/A11yServices', 'enabledList',
                    '(Landroid/view/accessibility/AccessibilityManager;I)Ljava/util/List;', false)
        } else {
            super.visitMethodInsn(opcode, owner, name, desc, itf)
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.instrumentation.transformClassesWith(A11yQueryRewrite.class, InstrumentationScope.ALL) {}
        variant.instrumentation.setAsmFramesComputationMode(FramesComputationMode.COPY_FRAMES)
    }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.auroratv"
    defaultConfig {
        applicationId "com.auroratv"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // BUMP THIS ON EVERY BUILD YOU INSTALL. Google TV's launcher caches an
        // app's icon against its versionCode, so a reinstall at the same code
        // keeps showing the icon from the FIRST install — which is why Aurora sat
        // in "Your apps" as the React Native template's green-grid robot for days
        // after the real adaptive icon was added and verified inside the APK.
        // (Confirmed by extracting the icon layers from the installed APK: they
        // were correct; the launcher was simply showing its cache.)
        versionCode 89
        versionName "5.1.26"
        // QA builds: Fresco's RequestLoggingListener + verbose FLog (MainApplication.kt), for
        // `adb logcat -s RequestLoggingListener`. On in debug, or `assembleRelease -PfrescoLog`.
        buildConfigField "boolean", "FRESCO_LOGGING", project.hasProperty('frescoLog') ? 'true' : 'false'
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Aurora's self-signed sideload key. Personal LAN app, not Play
            // Store. The keystore file is untracked; its credentials load from
            // android/keystore.properties (untracked — copy the .example) or
            // the AURORA_KEYSTORE_PASSWORD env var, never from the repo.
            def ksProps = new Properties()
            def ksPropsFile = rootProject.file('keystore.properties')
            if (ksPropsFile.exists()) ksPropsFile.withInputStream { ksProps.load(it) }
            storeFile file(ksProps.getProperty('storeFile', 'aurora.keystore'))
            storePassword ksProps.getProperty('storePassword', System.getenv('AURORA_KEYSTORE_PASSWORD') ?: '')
            keyAlias ksProps.getProperty('keyAlias', 'aurora')
            keyPassword ksProps.getProperty('keyPassword', System.getenv('AURORA_KEYSTORE_PASSWORD') ?: '')
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "FRESCO_LOGGING", "true"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // FileProvider, for the in-app updater (UpdaterModule.kt).
    implementation("androidx.core:core-ktx:1.13.1")
    // The launcher's Continue watching row and Aurora's own row (HomeScreenModule.kt).
    implementation("androidx.tvprovider:tvprovider:1.0.0")
    // JankStats: the frame monitor behind perfTier.ts (DeviceModule.kt).
    implementation("androidx.metrics:metrics-performance:1.0.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
