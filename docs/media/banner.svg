<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Aurora — your media, beautifully served">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d14"/>
      <stop offset="1" stop-color="#11141f"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37d4a0"/>
      <stop offset="0.55" stop-color="#4ec3c9"/>
      <stop offset="1" stop-color="#8b7bff"/>
    </linearGradient>
    <linearGradient id="veil1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#37d4a0" stop-opacity="0"/>
      <stop offset="1" stop-color="#37d4a0" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="veil2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8b7bff" stop-opacity="0"/>
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="14" fill="url(#bg)"/>

  <!-- aurora veils -->
  <path d="M0 320 C 220 140, 420 220, 640 120 C 860 20, 1060 140, 1280 60 L1280 0 L0 0 Z" fill="url(#veil1)"/>
  <path d="M0 0 L1280 0 L1280 120 C 1000 200, 760 60, 520 160 C 330 238, 140 190, 0 260 Z" fill="url(#veil2)"/>
  <path d="M60 250 C 320 120, 560 210, 830 110 C 1010 44, 1150 90, 1240 60" fill="none" stroke="url(#aurora)" stroke-width="2" stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="640" y="172" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="104" font-weight="800" letter-spacing="10"
        fill="url(#aurora)">AURORA</text>

  <text x="640" y="224" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="24" font-weight="400" letter-spacing="1.5"
        fill="#9aa1b5">A personal streaming platform, served straight from your PC to every screen in the house</text>
</svg>
